# Canonical description. Used word for word wherever a description of Felipe is needed.
description_en: >-
  Felipe G. Santos (Felipe González Santos) is a political sociologist and
  Postdoctoral Research Fellow at City St George's, University of London. He
  studies why people protest, how far-right actors build support through civil
  society, and how attitudes towards democracy shape political participation,
  drawing on cross-national surveys, survey experiments and fieldwork across
  Europe.
description_es: >-
  Felipe G. Santos (Felipe González Santos) es sociólogo político e
  investigador postdoctoral en City St George's, University of London. Estudia
  por qué la gente protesta, cómo la ultraderecha construye apoyos a través de
  la sociedad civil y cómo las actitudes hacia la democracia condicionan la
  participación política, con encuestas comparadas, experimentos de encuesta y
  trabajo de campo en Europa.
# First paragraph of the homepage.
intro_en: >-
  I study why people take to the streets, how the far right builds power, and
  what holds democracies together, or pulls them apart. My work combines
  cross-national surveys and survey experiments with social media and network
  analysis, interviews and ethnography.
intro_es: >-
  Investigo por qué la gente sale a la calle, cómo la ultraderecha construye
  poder y qué mantiene unidas a las democracias, o las destruye. Mi trabajo
  combina encuestas comparadas y experimentos de encuesta con datos de redes
  sociales, análisis de redes, entrevistas y etnografía.
