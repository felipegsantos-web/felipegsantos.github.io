- id: 2024-social-movements-that-care
  type: book
  status: published
  year: 2024
  authors:
  - Felipe G. Santos
  title: 'Social Movements that Care: Empathy, Solidarity, and Empowerment in the Fight Against Evictions'
  venue: Palgrave Macmillan, Cham
  publisher: Palgrave Macmillan
  publisher_place: Cham
  doi: 10.1007/978-3-031-74296-5
  isbn_print: 978-3-031-74295-8
  isbn_ebook: 978-3-031-74296-5
  url: https://link.springer.com/book/10.1007/978-3-031-74296-5
  page: social-movements-that-care
  pdf: /documents/publications/2024-social-movements-that-care.pdf
  pdf_version: published
  themes:
  - care
  keywords:
  - care
  - movements
  - housing
  summary_en: Why do the people hit hardest by a grievance often fail to mobilise, while others with no direct stake join in? Drawing on a year of participant observation in PAH Barcelona, 71 interviews with members across Spain and press coverage from 2009 to 2016, the book shows how the Platform of Those Affected by Mortgages used emotional, identity and participatory care to turn people facing eviction into activists.
  summary_es: ¿Por qué quienes más sufren un agravio a menudo no se movilizan, mientras que otras personas sin un interés directo sí lo hacen? A partir de un año de observación participante en la PAH de Barcelona, 71 entrevistas con miembros de toda España y la cobertura de prensa entre 2009 y 2016, el libro muestra cómo la Plataforma de Afectados por la Hipoteca recurrió al cuidado emocional, identitario y participativo para convertir en activistas a personas amenazadas de desahucio.
  why_en: It offers a theory of mobilisation based on care, which explains how movements recruit and empower people whose grievances discourage collective action, and how coalitions between affected and unaffected activists form.
  why_es: Propone una teoría de la movilización basada en el cuidado, que explica cómo los movimientos reclutan y empoderan a personas cuyos agravios dificultan la acción colectiva, y cómo se forman coaliciones entre activistas afectados y no afectados.
