  - Eduard Sala Barceló
  - Luís Manuel Sanmartín Cava
  title: La Plataforma de Afectadas por la Hipoteca. Una década de lucha por la vivienda digna 2009-2019
  venue: Edicions Bellaterra, Manresa
  publisher: Edicions Bellaterra
  publisher_place: Manresa
  url: https://www.bellaterra.coop/es/libros/la-plataforma-de-afectados-por-la-hipoteca
  pdf: /documents/publications/2022-pah-10-anos.pdf
  pdf_version: published
  themes:
  - care
  keywords:
  - movements
  - housing
  - spain
  summary_en: 'An edited volume on the first decade of the PAH, with fourteen contributions by academics and activists and prologues by Lucía Delgado and Jordi Mir. Its four sections cover:'
  summary_list_en:
  - the social and political context of the housing crisis, including its effects on health;
  - the origins and present of the PAH;
  - its tactics and strategies, from civil disobedience to campaigns to change the law;
  - its impact on academia, politics and migrant communities.
  summary_es: 'Un volumen colectivo sobre la primera década de la PAH, con catorce contribuciones de personas del mundo académico y activista y prólogos de Lucía Delgado y Jordi Mir. Sus cuatro secciones abordan:'
  summary_list_es:
  - el contexto social y político de la crisis de la vivienda, incluidos sus efectos sobre la salud;
  - los orígenes y el presente de la PAH;
  - sus tácticas y estrategias, desde la desobediencia civil hasta las campañas para cambiar las leyes;
  - su impacto en el mundo académico, político y migratorio.
  why_en: It brings together academic and activist perspectives on Spain's largest housing movement, several of them written by people who took part in it.
  why_es: Reúne miradas académicas y activistas sobre el mayor movimiento por la vivienda de España, varias de ellas escritas por personas que han formado parte de él.
- id: 2026-foot-in-parliament-foot-on-the-streets
  type: article
  status: published
  year: 2026
  online: '2026'
  authors:
  - Felipe G. Santos
  - Matthias Hoffmann
  - Dan Mercea
  title: 'One foot in parliament, one on the streets: Studying the fluid relation between individual participation and party evaluations of protest'
  venue: Party Politics
  doi: 10.1177/13540688251413043
  url: https://doi.org/10.1177/13540688251413043
  pdf: /documents/publications/2026-foot-in-parliament-foot-on-the-streets.pdf
  pdf_version: published
  themes:
  - movementparties
  - protest
  keywords:
  - protest
  - participation
  - parties
  summary_en: Combining parties' social media posts with nationally representative surveys in Denmark, Germany and the United Kingdom, the article examines how parties evaluate street protests and whether their voters take part in them. Parties of every type and ideology engage with protest, and they are more likely to support protests they agree with than to criticise those they oppose. Voters are more likely to join protests their party supports and to stay away from those it criticises.
  summary_es: Combinando las publicaciones de los partidos en redes sociales con encuestas representativas en Dinamarca, Alemania y el Reino Unido, el artículo analiza cómo valoran los partidos las protestas y si sus votantes participan en ellas. Partidos de todo tipo e ideología se pronuncian sobre las protestas, y lo hacen más para apoyar las que comparten que para criticar las que rechazan. Los votantes son más propensos a sumarse a las protestas que su partido apoya y a evitar las que critica.
  why_en: 'It shows that the link between parties and protest is not confined to movement parties: across the party system, what parties say about a protest goes hand in hand with whether their voters join it.'
  why_es: 'Muestra que el vínculo entre partidos y protesta no se limita a los partidos-movimiento: en todo el sistema de partidos, lo que un partido dice de una protesta va de la mano de la participación de sus votantes en ella.'
  oa_url: https://openaccess.city.ac.uk/id/eprint/36498/3/One%20foot%20in%20parliament.pdf
  oa_version: accepted
- id: 2025-united-for-hungary
  type: article
  status: published
  year: 2026
  online: July 2025
  authors:
  - Bálint Mikola
  - Felipe G. Santos
  title: 'Opposition electoral strategies against democratic backsliding: the United for Hungary coalition and its 2022 primaries'
  venue: Democratization
  volume: 33
  issue: 4
  pages: 902-926
  doi: 10.1080/13510347.2025.2522194
  url: https://doi.org/10.1080/13510347.2025.2522194
  pdf: /documents/publications/2025-united-for-hungary.pdf
  pdf_version: published
  themes:
  - democracy
  keywords:
  - democracy
  - elections
  summary_en: How do opposition parties respond to democratic backsliding? Using 31 interviews with party elites and a nationally representative survey, the article studies the six-party United for Hungary coalition and its 2022 open primaries. Parties joined the coalition for pragmatic reasons rooted in years of backsliding. People who took part in the primaries tended to hold pro-democratic attitudes, to be dissatisfied with democracy and to have experience of non-electoral participation.
  summary_es: ¿Cómo responden los partidos de la oposición al retroceso democrático? Con 31 entrevistas a dirigentes de partidos y una encuesta representativa, el artículo estudia la coalición de seis partidos Unidos por Hungría y sus primarias abiertas de 2022. Los partidos se unieron por razones pragmáticas derivadas de años de retroceso democrático. Quienes votaron en las primarias tendían a tener actitudes prodemocráticas, a estar insatisfechos con la democracia y a haber participado en formas de acción no electoral.
  why_en: It argues that backsliding pushes opposition parties to form ideologically diverse coalitions and to take on features of social movements, and that these choices match what their voters want.
  why_es: Sostiene que el retroceso democrático empuja a la oposición a formar coaliciones ideológicamente diversas y a adoptar rasgos de los movimientos sociales, y que estas decisiones responden a lo que quieren sus votantes.
  oa_url: https://openaccess.city.ac.uk/id/eprint/35460/1/Opposition%20electoral%20strategies%20against%20democratic%20backsliding%20%20the%20United%20for%20Hungary%20coalition%20and%20its%202022%20primaries.pdf
  oa_version: published
- id: 2024-policy-over-protest
  type: article
  status: published
  year: 2025
  online: '2024'
  authors:
  - Dan Mercea
  - Felipe G. Santos
  title: 'Policy over Protest: Experimental Evidence on the Drivers of Support for Movement Parties'
  venue: Perspectives on Politics
  volume: 23
  issue: 3
  pages: 901 onwards
  doi: 10.1017/S1537592724001439
  url: https://doi.org/10.1017/S1537592724001439
  pdf: /documents/publications/2024-policy-over-protest.pdf
  pdf_version: published
  themes:
  - movementparties
  keywords:
  - movement
  - parties
  - elections
  summary_en: What drives support for movement parties? A preregistered conjoint experiment in Denmark, Germany, Hungary, Italy, Romania and the United Kingdom shows that movement party voters favour neither institutional outsiders nor candidates who take part in protests. Candidates' policy positions matter most. These voters also prefer candidates who are anti-elitist or who want to keep the current political system running smoothly.
  summary_es: ¿Qué impulsa el apoyo a los partidos-movimiento? Un experimento conjoint prerregistrado en Dinamarca, Alemania, Hungría, Italia, Rumanía y el Reino Unido muestra que sus votantes no prefieren ni a candidatos ajenos a las instituciones ni a quienes participan en protestas. Lo que más pesa son las posiciones políticas de los candidatos. Estos votantes prefieren también a candidatos antielitistas o que quieren asegurar el buen funcionamiento del sistema político actual.
  why_en: Contrary to earlier research, it finds that support for movement parties rests on demand for decisive policy change rather than on candidates' protest experience or outsider status.
  why_es: Frente a investigaciones anteriores, concluye que el apoyo a los partidos-movimiento responde a la demanda de cambios políticos decididos, no a la experiencia de protesta ni a la condición de outsider de los candidatos.
  oa_url: https://www.cambridge.org/core/services/aop-cambridge-core/content/view/S1537592724001439
  oa_version: published
- id: 2025-protest-relational-field
  type: article
  status: published
  year: 2025
  authors:
  - Matthias Hoffmann
  - Felipe G. Santos
  - Dan Mercea
  title: 'Protest as a relational field: An analysis of brokerage positions within and across contentious episodes and the individuals occupying them'
  venue: International Journal of Sociology
  volume: 55
  issue: 4
  pages: 241-278
  doi: 10.1080/00207659.2025.2458419
  url: https://doi.org/10.1080/00207659.2025.2458419
  pdf: /documents/publications/2025-protest-relational-field.pdf
  pdf_version: published
  themes:
  - protest
  keywords:
  - protest
  - networks
  summary_en: 'Using survey data from six European countries, the article maps networks linking individuals to the protest episodes they took part in. It identifies two brokerage positions: coordinators, who connect episodes on the same issue, and boundary spanners, who connect episodes on different issues. Embeddedness in activist networks is the strongest predictor of both positions, although each is associated with a different type of embeddedness.'
  summary_es: 'Con datos de encuesta de seis países europeos, el artículo traza las redes que unen a las personas con los episodios de protesta en los que han participado. Identifica dos posiciones de intermediación: los coordinadores, que conectan episodios sobre un mismo tema, y los que cruzan fronteras, que conectan episodios sobre temas distintos. La inserción en redes activistas es el mejor predictor de ambas posiciones, aunque cada una se asocia a un tipo distinto de inserción.'
  why_en: It brings attention to the individuals who connect protest episodes, and shows how survey data can be used to study the structure of a protest field.
  why_es: Centra la atención en las personas que conectan episodios de protesta y muestra cómo los datos de encuesta permiten estudiar la estructura de un campo de protesta.
  oa_url: https://openaccess.city.ac.uk/id/eprint/34611/1/HoffmannSantosMercea_Protest%20as%20a%20relational%20field%20An%20analysis%20of%20brokerage%20positions.pdf
  oa_version: published
- id: 2024-protest-styles
  type: article
  status: published
  year: 2025
  authors:
  - Felipe G. Santos
  - Matthias Hoffmann
  - Dan Mercea
  title: 'Protesting at the intersection of individual characteristics and obstacles to participation: an analysis of the in-person, online and pivoting styles'
  venue: Journal of European Public Policy
  volume: 32
  issue: 8
  pages: 1958-1985
  doi: 10.1080/13501763.2024.2418962
  url: https://doi.org/10.1080/13501763.2024.2418962
  pdf: /documents/publications/2024-protest-styles.pdf
  pdf_version: published
  themes:
  - protest
  keywords:
  - protest
  - participation
  - digital
  summary_en: 'The article distinguishes three styles of protest participation: in-person, online, and pivoting between the two. Using a 2022 survey of 10,347 people in six European countries, it shows that online support can be an alternative for people who face obstacles to joining protests. The online style is more common among people without social contacts who facilitate participation. The in-person style prevails among older, less frequent social media users, and the pivoting style among younger, more biographically available media omnivores.'
  summary_es: 'El artículo distingue tres estilos de participación en protestas: presencial, online y uno que alterna entre ambos. Con una encuesta de 2022 a 10.347 personas en seis países europeos, muestra que el apoyo online puede ser una alternativa para quienes encuentran obstáculos para acudir a una protesta. El estilo online es más habitual entre quienes carecen de contactos que faciliten su participación. El presencial predomina entre personas mayores que usan menos las redes sociales, y el alterno entre jóvenes con más disponibilidad biográfica y un consumo de medios variado.'
  why_en: It shows that online protest is a response to specific obstacles rather than a weaker version of taking to the streets, which matters for debates on whether civic engagement is in decline.
  why_es: Muestra que la protesta online responde a obstáculos concretos y no es una versión débil de salir a la calle, algo relevante para el debate sobre si el compromiso cívico está en declive.
  oa_url: https://openaccess.city.ac.uk/id/eprint/33912/1/Santos_et.al_Protesting%20at%20the%20intersection%20of%20individual%20characteristics%20and%20obstacles%20to%20participation.pdf
  oa_version: published
- id: 2024-actual-potential-non-participants
  type: article
  status: published
  year: 2025
  authors:
  - Dan Mercea
  - Felipe G. Santos
  - Matthias Hoffmann
  title: 'Actual, Potential, and Non-Participants: Advancing the Differential Analysis of Protest Participation'
  venue: Political Studies
  volume: 73
  issue: 4
  pages: 1392-1417
  doi: 10.1177/00323217241297905
  url: https://doi.org/10.1177/00323217241297905
  pdf: /documents/publications/2024-actual-potential-non-participants.pdf
  pdf_version: published
  themes:
  - protest
  keywords:
  - protest
  - participation
  summary_en: Rather than dividing people into protesters and non-protesters, the article places them on a gradient from non-participation through potential to actual participation. Using survey data from six European countries (10,347 respondents), it finds that some factors raise the likelihood of each step in a linear way. Others separate both protesters and potential protesters from non-participants, but do not distinguish between the first two.
  summary_es: En lugar de dividir a la población entre quienes protestan y quienes no, el artículo la sitúa en un gradiente que va de la no participación a la participación potencial y a la efectiva. Con datos de encuesta de seis países europeos (10.347 personas), muestra que algunos factores aumentan de forma lineal la probabilidad de avanzar en cada paso. Otros distinguen a manifestantes y manifestantes potenciales de quienes no participan, pero no a los dos primeros entre sí.
  why_en: It shows that the path into protest is punctuated rather than linear, giving a more precise account of mobilisation potential than the usual divide between participants and non-participants.
  why_es: Muestra que el camino hacia la protesta avanza a saltos y no de forma lineal, lo que permite medir el potencial de movilización con más precisión que la división habitual entre participantes y no participantes.
  oa_url: https://openaccess.city.ac.uk/id/eprint/34087/1/MERCEA~1.PDF
  oa_version: published
- id: 2024-vox-top-down-cso
  type: profile
  status: published
  year: 2025
  online: May 2024
  authors:
  - Felipe G. Santos
  title: 'Far-right strategies to co-opt progressive politics: Vox''s top-down civil society organizations in Spain'
  venue: Social Movement Studies
  volume: 24
  issue: 5
  pages: 652-660
  doi: 10.1080/14742837.2024.2359652
  url: https://doi.org/10.1080/14742837.2024.2359652
  pdf: /documents/publications/2024-vox-top-down-cso.pdf
  pdf_version: published
  themes:
  - farright
  keywords:
  - far-right
  - spain
  - vox
  summary_en: 'This profile examines four organisations created and led by Vox members: the trade union Solidaridad, the urban group Mi Barrio Seguro, the environmental group Nostra Terra and the women''s organisation AMPI. Presenting themselves as grassroots groups, they let the party recast labour rights, urban policy, the environment and women''s rights from a far-right perspective, and connect its electoral and non-electoral activity.'
  summary_es: 'Este perfil analiza cuatro organizaciones creadas y dirigidas por miembros de Vox: el sindicato Solidaridad, el colectivo urbano Mi Barrio Seguro, el grupo ecologista Nostra Terra y la organización de mujeres AMPI. Presentándose como grupos de base, permiten al partido reformular desde la ultraderecha cuestiones como los derechos laborales, la política urbana, el medio ambiente y los derechos de las mujeres, y conectar su actividad electoral y no electoral.'
  why_en: 'It documents a strategy that differs both from infiltrating existing civil society and from becoming a movement party: a far-right party creating its own organisations on issues associated with the left.'
  why_es: 'Documenta una estrategia distinta tanto de la infiltración en la sociedad civil existente como de la conversión en partido-movimiento: un partido de ultraderecha que crea sus propias organizaciones en temas asociados a la izquierda.'
  oa_url: https://openaccess.city.ac.uk/id/eprint/33256/1/PROFILE%20%20Far-right%20strategies%20to%20co-opt%20progressive%20politics%20%20Vox%20s%20top-down%20civil%20society%20organizations%20in%20Spain.pdf
  oa_version: published
- id: 2024-young-democrats-protest-voters
  type: article
  status: published
  year: 2025
  online: January 2024
  authors:
  - Felipe G. Santos
  - Dan Mercea
  title: 'Young democrats, critical citizens and protest voters: studying the profiles of movement party supporters'
  venue: Acta Politica
  volume: 60
  pages: 167-188
  doi: 10.1057/s41269-023-00321-7
  url: https://doi.org/10.1057/s41269-023-00321-7
  pdf: /documents/publications/2024-young-democrats-protest-voters.pdf
  pdf_version: published
  themes:
  - movementparties
  keywords:
  - movement
  - parties
  - voters
  summary_en: Using nationally representative surveys in six European countries, the article identifies four types of movement party (green/left-libertarian, far-right, centrist and eclectic) and compares their voters. The only trait these voters share is the belief that protest has influence. Green/left-libertarian voters reflect a generational divide, far-right voters resemble protest voters, and centrist and eclectic voters fit the profile of critical citizens.
  summary_es: Con encuestas representativas en seis países europeos, el artículo identifica cuatro tipos de partido-movimiento (verde o libertario de izquierdas, de ultraderecha, centrista y ecléctico) y compara a sus votantes. Lo único que comparten es la creencia en la influencia de las protestas. Los votantes verdes y libertarios de izquierdas reflejan una brecha generacional, los de ultraderecha se parecen a los votantes de protesta, y los centristas y eclécticos encajan en el perfil de ciudadanos críticos.
  why_en: It questions whether "movement party" is a useful category for understanding voting behaviour, since the electorates of these parties have very different motivations.
  why_es: Cuestiona la utilidad de la categoría de partido-movimiento para entender el voto, ya que sus electorados tienen motivaciones muy distintas.
  oa_url: https://openaccess.city.ac.uk/id/eprint/32067/1/s41269-023-00321-7.pdf
  oa_version: published
- id: 2024-protesting-the-lockdown
  type: article
  status: published
  year: 2024
  authors:
  - Dan Mercea
  - Michael Saker
  - Felipe G. Santos
  title: 'Protesting the lockdown: geo-indexing a movement publicly opposing Covid-19 policies on Facebook'
  venue: Social Movement Studies
  volume: 23
  issue: 6
  pages: 695-718
  doi: 10.1080/14742837.2024.2336957
  url: https://doi.org/10.1080/14742837.2024.2336957
  pdf: /documents/publications/2024-protesting-the-lockdown.pdf
  pdf_version: published
  themes:
  - protest
  keywords:
  - protest
  - covid
  - digital
  summary_en: The article analyses 53,289 posts published in 2020 on 96 public Facebook groups and pages opposing Covid-19 restrictions. It proposes the concept of geo-indexing, the practice of adding meaning to physical places on social media, and identifies a transnational network of geo-indexed posts. Opposition was framed as united against unjust and undemocratic measures, and its language was less conspiratorial than expected.
  summary_es: El artículo analiza 53.289 publicaciones de 2020 en 96 grupos y páginas públicas de Facebook contrarios a las restricciones por la Covid-19. Propone el concepto de geoindexación, la práctica de dotar de significado a lugares físicos en las redes sociales, e identifica una red transnacional de publicaciones geoindexadas. La oposición se presentaba unida frente a unas medidas consideradas injustas y antidemocráticas, con un lenguaje menos conspirativo de lo esperado.
  why_en: Geo-indexing offers a way to study how online communication links protest to physical places, and how movements use those places to show their scale and cohesion.
  why_es: La geoindexación permite estudiar cómo la comunicación online vincula la protesta a lugares físicos y cómo los movimientos usan esos lugares para mostrar su tamaño y cohesión.
  oa_url: https://openaccess.city.ac.uk/id/eprint/32665/8/Mercea_Protesting%20the%20lockdown%20%20geo-indexing%20a%20movement%20publicly%20opposing%20Covid-19%20policies%20on%20Facebook.pdf
  oa_version: published
- id: 2024-how-activists-build-power
  type: article
  status: published
  year: 2024
  authors:
  - Felipe G. Santos
  title: 'How activists build power: passive beneficiary involvement and empowerment in the Platform of Those Affected by Mortgages'
  venue: European Societies
  volume: 26
  issue: 1
  pages: 34-62
  doi: 10.1080/14616696.2023.2214199
  url: https://doi.org/10.1080/14616696.2023.2214199
  pdf: /documents/publications/2024-how-activists-build-power.pdf
  pdf_version: published
  themes:
  - care
  keywords:
  - movements
  - empowerment
  - housing
  summary_en: How do social movement organisations mobilise people who are heavily aggrieved and disempowered? Drawing on a year of participant observation and 71 interviews with members of the PAH, the article shows how its members developed strategies to recruit and empower people who first came to the organisation for help with their own eviction.
  summary_es: ¿Cómo movilizan las organizaciones de los movimientos sociales a personas muy afectadas y sin poder? A partir de un año de observación participante y 71 entrevistas con miembros de la PAH, el artículo muestra cómo sus miembros desarrollaron estrategias para reclutar y empoderar a quienes llegaban a la organización buscando ayuda ante su propio desahucio.
  why_en: It moves the study of recruitment beyond individual characteristics and networks, towards what organisations do to make participation possible.
  why_es: Lleva el estudio del reclutamiento más allá de las características y redes individuales, hacia lo que hacen las organizaciones para hacer posible la participación.
  oa_url: https://openaccess.city.ac.uk/id/eprint/30471/8/How%20activists%20build%20power%20passive%20beneficiary%20involvement%20and%20empowerment%20in%20the%20platform%20of%20those%20affected%20by%20mortgages.pdf
  oa_version: published
- id: 2023-campo-movimientos-sociales-espana
  type: article
  status: published
  year: 2023
  authors:
  - Gomer Betancor Nuez
  - Felipe G. Santos
  title: La configuración del campo de estudio de los movimientos sociales en España (1980-2020)
  venue: Revista Española de Sociología
  volume: 32
  issue: 1
  pages: a145
  doi: 10.22325/fes/res.2023.145
  url: https://doi.org/10.22325/fes/res.2023.145
  pdf: /documents/publications/2023-campo-movimientos-sociales-espana.pdf
  pdf_version: published
  themes:
  - care
  - protest
  keywords:
  - sociology
  - spain
  - movements
  summary_en: The article traces how the study of social movements developed as a field in Spain between 1980 and 2020. It combines publication data from Dialnet and Web of Science, papers presented at sociology and political science conferences, and interviews with pioneers of the field. The field grew gradually and later than in other European countries, expanding with the normalisation of protest and, above all, after the 15M cycle.
  summary_es: El artículo reconstruye cómo se configuró en España el estudio de los movimientos sociales como campo entre 1980 y 2020. Combina datos de publicaciones de Dialnet y Web of Science, las comunicaciones presentadas en congresos de sociología y ciencia política, y entrevistas con pioneros y pioneras del campo. El campo creció de forma paulatina y con retraso respecto a otros países europeos, impulsado por la normalización de la protesta y, sobre todo, por el ciclo del 15M.
  why_en: It gives a first systematic account of how the field took shape in Spain, and of which international theories and topics it took up or left aside.
  why_es: Ofrece una primera aproximación sistemática a cómo se formó el campo en España y a qué teorías y temas internacionales adoptó o dejó de lado.
  oa_url: https://recyt.fecyt.es/index.php/res/article/download/89670/70423
  oa_version: published
- id: 2022-big-data-news-repositories
  type: article
  status: published
  year: 2022
  authors:
  - Matthias Hoffmann
  - Felipe G. Santos
  - Christina Neumayer
  - Dan Mercea
  title: 'Lifting the Veil on the Use of Big Data News Repositories: A Documentation and Critical Discussion of a Protest Event Analysis'
  venue: Communication Methods and Measures
  volume: 16
  issue: 4
  pages: 283-302
  doi: 10.1080/19312458.2022.2128099
  url: https://doi.org/10.1080/19312458.2022.2128099
  pdf: /documents/publications/2022-big-data-news-repositories.pdf
  pdf_version: published
  themes:
  - protest
  keywords:
  - methods
  - big
  - data
  summary_en: 'Documenting the extraction of protest events from GDELT for six European countries over seven years, the article shows what it takes to make a free big data news repository usable for research: additional computational data collection, neural machine translation, dictionary-based content analysis, machine-learning classification and human coding.'
  summary_es: 'A partir de la extracción de eventos de protesta de GDELT en seis países europeos durante siete años, el artículo documenta lo que cuesta convertir un repositorio gratuito de noticias en datos útiles para la investigación: recogida adicional de datos, traducción automática neuronal, análisis de contenido con diccionarios, clasificación con aprendizaje automático y codificación manual.'
  why_en: It shows that "free" event datasets carry large hidden costs in knowledge, labour, money and computing power, and that they should not be taken at face value.
  why_es: Muestra que los conjuntos de datos de eventos "gratuitos" tienen grandes costes ocultos de conocimiento, trabajo, dinero y capacidad de cálculo, y que no deben tomarse sin examen.
  oa_url: https://openaccess.city.ac.uk/id/eprint/28866/1/Hoffmann_Lifting%20the%20Veil%20on%20the%20Use%20of%20Big%20Data%20News%20Repositories%20A%20Documentation%20and%20Critical%20Discussion%20of%20A%20Protest%20Event%20Analysis.pdf
  oa_version: published
- id: 2022-anti-gender-european-parliament
  type: article
  status: published
  year: 2022
  authors:
  - Felipe G. Santos
  - Dorit Geva
  title: 'Populist strategy in the European Parliament: How the anti-gender movement sabotaged deliberation about sexual health and reproductive rights'
  venue: European Journal of Cultural and Political Sociology
  doi: 10.1080/23254823.2022.2113417
  url: https://doi.org/10.1080/23254823.2022.2113417
  pdf: /documents/publications/2022-anti-gender-european-parliament.pdf
  pdf_version: published
  themes:
  - farright
  keywords:
  - far-right
  - anti-gender
  - europe
  summary_en: The article traces the defeat of the 2013 Estrela Report on sexual and reproductive health and rights in the European Parliament. Drawing on public material from ultra-conservative groups and interviews with people targeted by the campaign, it shows how a populist strategy undermined deliberation through "antagonist politics", which polarised centrist MEPs, and "thin proceduralism", which used procedural rules to end the debate.
  summary_es: El artículo reconstruye la derrota del Informe Estrela de 2013 sobre salud y derechos sexuales y reproductivos en el Parlamento Europeo. A partir de material público de grupos ultraconservadores y de entrevistas con personas que fueron objeto de la campaña, muestra cómo una estrategia populista socavó la deliberación mediante una "política antagonista", que polarizó a los eurodiputados de centro, y un "procedimentalismo mínimo", que usó las reglas de procedimiento para cerrar el debate.
  why_en: It shows how right-wing populist strategy works inside a parliament once known for consensus, and how procedure itself can be used to shut down deliberation.
  why_es: Muestra cómo funciona la estrategia populista de derechas dentro de un parlamento antes caracterizado por el consenso, y cómo el propio procedimiento puede servir para clausurar la deliberación.
  oa_url: https://openaccess.city.ac.uk/id/eprint/28830/1/Populist%20strategy%20in%20the%20European%20parliament%20-%20PUBLISHED.pdf
  oa_version: published
- id: 2021-far-right-schools
  type: article
  status: published
  year: 2021
  authors:
  - Dorit Geva
  - Felipe G. Santos
  title: Europe's far-right educational projects and their vision for the international order
  venue: International Affairs
  volume: 97
  issue: 5
  pages: 1395-1414
  doi: 10.1093/ia/iiab112
  url: https://doi.org/10.1093/ia/iiab112
  pdf: /documents/publications/2021-far-right-schools.pdf
  pdf_version: published
  themes:
  - farright
  keywords:
  - far-right
  - education
  - europe
  summary_en: Through two far-right institutions of higher education, Hungary's National University of Public Service and the Institute of Social Sciences, Economics and Politics (ISSEP) in France and Spain, the article identifies a project it calls "globalist illiberalism". It accepts global markets and institutions, while defending national sovereignty on cultural matters and a radicalised vision of Christianity.
  summary_es: A través de dos instituciones de educación superior vinculadas a la ultraderecha, la Universidad Nacional de la Función Pública de Hungría y el Instituto de Ciencias Sociales, Económicas y Políticas (ISSEP) en Francia y España, el artículo identifica un proyecto que denomina "iliberalismo globalista". Este acepta los mercados y las instituciones globales, a la vez que defiende la soberanía nacional en lo cultural y una visión radicalizada del cristianismo.
  why_en: It shows that parts of Europe's far right aim to transform the international order rather than reject it, and that higher education is one of the ways they pursue this.
  why_es: Muestra que parte de la ultraderecha europea aspira a transformar el orden internacional y no a rechazarlo, y que la educación superior es una de las vías con las que lo persigue.
