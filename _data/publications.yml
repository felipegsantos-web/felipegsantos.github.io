  summary_en: The concluding chapter of <em>Protest and Democracy</em>. It brings together the book's findings on how citizens, social movements and movement parties interact in six European countries. It argues that democratic quality cannot be understood without considering participation outside institutions, and sets out recommendations for policymakers, including on how established parties and the media deal with challenger parties online.
  summary_es: El capítulo de conclusiones de <em>Protest and Democracy</em>. Reúne los hallazgos del libro sobre la interacción entre ciudadanía, movimientos sociales y partidos-movimiento en seis países europeos. Sostiene que la calidad democrática no puede entenderse sin la participación fuera de las instituciones, y formula recomendaciones para responsables políticos, entre ellas sobre cómo los partidos establecidos y los medios tratan a los partidos desafiantes en el entorno digital.
- id: 2022-transversalidad-pah
  type: chapter
  status: published
  year: 2022
  authors:
  - Felipe González Santos
  - Montserrat Emperador Badimon
  title: 'La transversalidad puesta en práctica: cuidados e inteligencia colectiva en la PAH'
  venue: 'In A. Razquin and G. Betancor (coords.), <em>Diez años construyendo ciudadanía en movimiento(s): El 15M y otras luchas hermanas</em>. Edicions Bellaterra, pp. 141-150.'
  venue_es: 'En A. Razquin y G. Betancor (coords.), <em>Diez años construyendo ciudadanía en movimiento(s): El 15M y otras luchas hermanas</em>. Edicions Bellaterra, pp. 141-150.'
  publisher: Edicions Bellaterra
  book_title: 'Diez años construyendo ciudadanía en movimiento(s): El 15M y otras luchas hermanas'
  pages: 141-150
  url: https://www.bellaterra.coop/es/libros/diez-anos-construyendo-ciudadania-en-movimiento-s
  pdf: /documents/publications/2022-transversalidad-pah.pdf
  pdf_version: published
  themes:
  - care
  keywords:
  - movements
  - housing
  - spain
  summary_en: How does the PAH involve people with no previous activist experience? Drawing on interviews with six of its founders and other activists between 2013 and 2017, and on hundreds of hours of observing assemblies and protests in Barcelona, the chapter argues that the PAH's inclusive participation is not a settled achievement. It is the changing result of trial and error, based on care that covers emotional, identity and practical needs.
  summary_es: ¿Cómo logra la PAH que participen personas sin experiencia militante previa? A partir de entrevistas con seis fundadoras y otras activistas entre 2013 y 2017, y de cientos de horas de observación de asambleas y acciones en Barcelona, el capítulo sostiene que la participación inclusiva y transversal de la PAH no es un logro consolidado. Es el resultado cambiante de un proceso de ensayo y error, basado en una dinámica de cuidados que abarca lo emocional, lo identitario y lo práctico.
  why_en: It shows how a movement can open participation to ordinary citizens instead of relying on experienced activists.
  why_es: Muestra cómo un movimiento puede abrir la participación a la ciudadanía ordinaria en lugar de depender de activistas con experiencia.
