- id: 2020-politics-of-care
  type: article
  status: published
  year: 2020
  authors:
  - Felipe G. Santos
  title: 'Social movements and the politics of care: empathy, solidarity and eviction blockades'
  venue: Social Movement Studies
  doi: 10.1080/14742837.2019.1665504
  url: https://doi.org/10.1080/14742837.2019.1665504
  pdf: /documents/publications/2020-politics-of-care.pdf
  pdf_version: published
  themes:
  - care
  keywords:
  - movements
  - care
  - housing
  summary_en: Why do people who share a grievance not always act together, and why do others join causes that do not benefit them? Developing a perspective based on the ethics of care and applying it to the PAH, the article argues three things. Aggrieved people may not mobilise when their emotional, identity and participatory needs go unmet. Empathy moves unaffected people to start mobilising. Care work builds solidarity among those affected during mobilisation.
  summary_es: ¿Por qué las personas que comparten un agravio no siempre actúan juntas, y por qué otras se suman a causas que no les benefician? Desde la ética del cuidado y a partir del caso de la PAH, el artículo sostiene tres cosas. Las personas afectadas pueden no movilizarse cuando sus necesidades emocionales, identitarias y participativas no están cubiertas. La empatía lleva a personas no afectadas a iniciar la movilización. El trabajo de cuidado construye solidaridad entre las afectadas durante la movilización.
  why_en: It brings care into the study of political solidarity in social movements, and lays the basis for the argument later developed in <em>Social Movements that Care</em>.
  why_es: Incorpora el cuidado al estudio de la solidaridad política en los movimientos sociales y sienta las bases del argumento que desarrolla después <em>Social Movements that Care</em>.
  oa_url: https://openaccess.city.ac.uk/id/eprint/29169/1/Social%20Movements%20and%20the%20Politics%20of%20Care%20-%20FGS.pdf
  oa_version: accepted
- id: 2024-methodological-pluralism
  type: chapter
  status: published
  year: 2025
  authors:
  - Felipe G. Santos
  - Claudius Wagemann
  title: Methodological pluralism in the study of political participation
  venue: 'In C. Wagemann, T. Burean, D. Mercea, L. Mosca and C. Neumayer (eds.), <em>Protest and Democracy: How Movement Parties, Social Movements and Active Citizens Are Reshaping Europe</em>. Routledge, pp. 27-43.'
  venue_es: 'En C. Wagemann, T. Burean, D. Mercea, L. Mosca and C. Neumayer (eds.), <em>Protest and Democracy: How Movement Parties, Social Movements and Active Citizens Are Reshaping Europe</em>. Routledge, pp. 27-43.'
  publisher: Routledge
  book_title: Protest and Democracy
  pages: 27-43
  doi: 10.4324/9781003532507-3
  url: https://doi.org/10.4324/9781003532507-3
  pdf: /documents/publications/2024-methodological-pluralism.pdf
  pdf_version: published
  themes:
  - protest
  keywords:
  - methodology
  - participation
  summary_en: The chapter asks how to choose methods when the objects of study differ. Protest participants invite large-N studies of transitory groups, while the targets of protest and democratic quality involve a few cases that are stable over time. It reviews the dispute between large-N and small-N research. It then sets out a typology of designs by number of cases, level of analysis and observational or experimental design, and presents the mixed-methods approach of the ProDem project.
  summary_es: El capítulo plantea cómo elegir métodos cuando los objetos de estudio son distintos. Quienes participan en protestas invitan a estudios de N grande sobre grupos transitorios, mientras que los destinatarios de la protesta y la calidad democrática suponen pocos casos, estables en el tiempo. Repasa la disputa entre la investigación de N grande y la de N pequeño. A continuación propone una tipología de diseños según el número de casos, el nivel de análisis y el carácter observacional o experimental, y presenta el enfoque de métodos mixtos del proyecto ProDem.
  why_en: It argues for choosing and combining methods according to what each research question requires, rather than treating mixed methods as a default.
  why_es: Defiende elegir y combinar métodos según lo que requiere cada pregunta de investigación, en lugar de tratar los métodos mixtos como opción por defecto.
