- id: 2022-cuidados-primer-desahucio
  type: chapter
  status: published
  year: 2021
  authors:
  - Felipe González Santos
  title: 'Cuidados y derecho a la vivienda: Orígenes de la Plataforma de Afectadas por la Hipoteca hasta su primer STOP Desahucios'
  venue: In G. D'Adda et al. (coords.), <em>La Plataforma de Afectadas por la Hipoteca. Una década de lucha por la vivienda digna 2009-2019</em>. Edicions Bellaterra, pp. 115-133.
  venue_es: En G. D'Adda et al. (coords.), <em>La Plataforma de Afectadas por la Hipoteca. Una década de lucha por la vivienda digna 2009-2019</em>. Edicions Bellaterra, pp. 115-133.
  publisher: Edicions Bellaterra
  book_title: La Plataforma de Afectadas por la Hipoteca. Una década de lucha por la vivienda digna 2009-2019
  pages: 115-133
  url: https://www.bellaterra.coop/es/libros/la-plataforma-de-afectados-por-la-hipoteca
  pdf: /documents/publications/2022-cuidados-primer-desahucio.pdf
  pdf_version: published
  themes:
  - care
  keywords:
  - movements
  - housing
  summary_en: 'The chapter traces the origins of the PAH, from the earlier activism of its founders to its first STOP Desahucios action. It argues that an important part of collective action is guided by an ethics of care. None of the founders had a mortgage problem: empathy moved them to act. Collective advice assemblies and accompaniment then made people who preferred not to mobilise feel able to stop evictions through non-violent civil disobedience.'
  summary_es: 'El capítulo reconstruye los orígenes de la PAH, desde el activismo previo de sus fundadoras hasta su primer STOP Desahucios. Sostiene que una parte importante de la acción colectiva se guía por una ética de los cuidados. Ninguna de las fundadoras tenía un problema hipotecario: fue la empatía lo que las movilizó. Las asambleas de asesoramiento colectivo y los acompañamientos hicieron después que personas reacias a movilizarse se sintieran capaces de parar desahucios mediante la desobediencia civil no violenta.'
  why_en: It explains the founding of the PAH from the perspective of care, as a complement to accounts of mobilisation based on shared interests.
  why_es: Explica el nacimiento de la PAH desde la perspectiva de los cuidados, como complemento a las explicaciones de la movilización basadas en intereses compartidos.
