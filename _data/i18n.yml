# Interface strings. Every key has an `en` and an `es` value.
skip_link:
  en: Skip to main content
  es: Ir al contenido principal
logo_label:
  en: Felipe G. Santos · Home
  es: Felipe G. Santos · Inicio
nav_label:
  en: Main navigation
  es: Navegación principal
mobile_nav_label:
  en: Mobile navigation
  es: Navegación móvil
lang_group_label:
  en: Language selector
  es: Selector de idioma
# Language names are keyed by language code (not by page language): each is written in its own language.
lang_name:
  en: English
  es: Español
theme_to_dark_label:
  en: Switch to dark mode
  es: Cambiar a modo oscuro
theme_to_light_label:
  en: Switch to light mode
  es: Cambiar a modo claro
menu_open_label:
  en: Open menu
  es: Abrir menú
menu_close_label:
  en: Close menu
  es: Cerrar menú
# Footer line under the name: "%role% · %institution%" (the institution is the current post in profile.yml).
footer_role:
  en: Political Sociologist
  es: Sociólogo político
profiles_label:
  en: Academic profiles
  es: Perfiles académicos
# Main navigation, in order. `url` is per language. `key` is how templates look an item up.
nav:
  - key: research
    label: {en: Research, es: Investigación}
    url: {en: /en/current-work/, es: /es/trabajo-actual/}
    description: {en: "Funded research projects, current and past", es: "Proyectos de investigación financiados, en curso y anteriores"}
  - key: publications
    label: {en: Publications, es: Publicaciones}
    url: {en: /en/publications/, es: /es/publicaciones/}
    description: {en: "Publications by research theme, with summaries", es: "Publicaciones por tema de investigación, con resúmenes"}
  - key: media
    label: {en: Media, es: Medios}
    url: {en: /en/media/, es: /es/medios/}
    description: {en: "Press, radio, podcast and opinion coverage", es: "Prensa, radio, pódcast y artículos de opinión"}
  - key: cv
    label: {en: CV, es: CV}
    url: {en: /en/cv/, es: /es/cv/}
    description: {en: "Curriculum vitae: posts, projects, education, awards and service", es: "Currículum: puestos, proyectos, formación, premios y servicio profesional"}
  - key: contact
    label: {en: Contact, es: Contacto}
    url: {en: /en/contact/, es: /es/contacto/}
    description: {en: "Contact details", es: "Datos de contacto"}
# Publications
pub_type_label:
  book: {en: Book, es: Libro}
  article: {en: Journal Article, es: Artículo}
  chapter: {en: Book Chapter, es: Capítulo de libro}
# Types whose badge text differs from their group's.
pub_type_name:
  profile: {en: Profile, es: Perfil}
  edited_volume: {en: Edited volume, es: Volumen colectivo}
# Types that share the badge and the filter of another type.
pub_type_group:
  book: book
  edited_volume: book
  article: article
  chapter: chapter
  encyclopedia_entry: chapter
  profile: article
# Label of the section menu on the CV pages (phones).
jump_to_section:
  en: Jump to section
  es: Ir a la sección
# Articles without a volume yet: "Party Politics, online first."
online_first:
  en: online first
  es: publicación anticipada en línea
why_it_matters:
  en: "Why it matters:"
  es: "Por qué importa:"
and_word:
  en: and
  es: y
# "A version of the article published in Acta Politica (2025)." The link wraps `link`, the journal and the year.
version_of:
  before: {en: "A version of the ", es: "Versión del "}
  link: {en: article published in, es: artículo publicado en}
book_page_label:
  en: About the book →
  es: Sobre el libro →
# English lists use a serial comma ("A, B, and C"); Spanish does not.
serial_comma:
  en: true
  es: false
eds_suffix:
  en: (eds.)
  es: (coords.)
open_access_label:
  en: Open access (PDF)
  es: Acceso abierto (PDF)
pdf_label:
  published: {en: PDF, es: PDF}
  accepted: {en: Accepted manuscript (PDF), es: Manuscrito aceptado (PDF)}
oa_version_note:
  accepted: {en: accepted version, es: versión aceptada}
  published: {en: published version, es: versión publicada}
theme_publications_heading:
  en: Publications on this theme
  es: Publicaciones sobre este tema
view_mode_label:
  en: View mode
  es: Modo de vista
view_themes:
  en: Research Themes
  es: Temas de investigación
view_list:
  en: All Publications
  es: Todas las publicaciones
filter_pubs_label:
  en: Filter publications
  es: Filtrar publicaciones
filter_all:
  en: All
  es: Todo
filter_books:
  en: Books
  es: Libros
filter_articles:
  en: Articles
  es: Artículos
filter_chapters:
  en: Chapters
  es: Capítulos
theme_path:
  en: /en/publications/theme/
  es: /es/publicaciones/tema/
publication_count:
  one: {en: publication, es: publicación}
  other: {en: publications, es: publicaciones}
back_to_publications:
  en: ← All publications
  es: ← Todas las publicaciones
# Media
filter_media_label:
  en: Filter media
  es: Filtrar medios
# Roles in media.yml. `label` heads each item; `filter` is the button text.
media_role:
  quoted: {label: {en: Quoted in, es: Citado en}, filter: {en: Quoted in, es: Citado en}}
  guest: {label: {en: Guest on, es: Invitado en}, filter: {en: Guest on, es: Invitado en}}
  oped: {label: {en: Op-ed, es: Artículo de opinión}, filter: {en: Op-eds, es: Artículos de opinión}}
# "April 2026" / "abril de 2026"; used for every date shown as month and year (media, news).
month_names:
  en: [January, February, March, April, May, June, July, August, September, October, November, December]
  es: [enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]
month_year:
  en: "%month% %year%"
  es: "%month% de %year%"
with_authors:
  en: "With %names%."
  es: "Con %names%."
# Homepage
news_type:
  media: {en: Media, es: Medios}
  publication: {en: Publication, es: Publicación}
news_label:
  en: Recent news and updates
  es: Noticias y actualizaciones recientes
news_heading:
  en: News & Updates
  es: Noticias y novedades
research_heading:
  en: Research themes
  es: Temas de investigación
# Homepage sentence about the current post, filled from profile.yml (posts) and projects.yml.
current_post_sentence:
  en: "I am a %role% in the %department% at %institution%, working on %project%."
  es: "Soy %role% en el %department% de %institution%, y trabajo en el proyecto %project%."
# Research page and CV
projects_current:
  en: Current
  es: En curso
projects_past:
  en: Past
  es: Anteriores
date_to:
  en: to
  es: a
date_present:
  en: present
  es: la actualidad
media_filter_all:
  en: All
  es: Todos
