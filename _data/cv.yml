# CV page sections, in order. Source: Felipe's CV PDF (19 October 2026) and the fixed dates in profile.yml.
# `source: posts` takes the posts of that `status` from profile.yml; `source: projects` lists projects.yml (facts only).
# Other sections list `entries`. Dates are `from` / `to` as YYYY-MM (no `to` = present), or a free `years` text.
# A field without suffix applies to both languages; `field_en` / `field_es` override it. Inline HTML allowed.
