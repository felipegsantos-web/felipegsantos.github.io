  funder_es: Fundación Europea del Clima
  host: City St George's, University of London
  years_en: June 2023 to December 2024
  years_es: junio de 2023 a diciembre de 2024
  role: Co-PI
  status: past
- id: prodem
  name: ProDem
  title: "Protest and Democracy: How Movement Parties, Social Movements and Active Citizens are Reshaping Europe"
  funder_en: Volkswagen Foundation
  funder_es: Fundación Volkswagen
  grant: "98144"
  status: past
  description_en: "ProDem (Protest and Democracy: How Movement Parties, Social Movements and Active Citizens are Reshaping Europe), funded by the Volkswagen Foundation (grant 98144). Its outputs include the edited book <em>Protest and Democracy</em> (Routledge, 2025) and a six-country survey of 10,347 people (2022)."
  description_es: "ProDem (Protest and Democracy: How Movement Parties, Social Movements and Active Citizens are Reshaping Europe), financiado por la Fundación Volkswagen (subvención 98144). Entre sus resultados están el libro colectivo <em>Protest and Democracy</em> (Routledge, 2025) y una encuesta en seis países a 10.347 personas (2022)."
