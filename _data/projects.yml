projects:
- id: interfaced
  name: INTERFACED
  title: "Interfaces for Democratic Participation: Deliberation, Mobilization, and Contestation Since the Onset of the Covid-19 Pandemic"
  funder: Horizon Europe
  status: current
  url: https://www.interfaced.eu/
  description_en: "INTERFACED (Interfaces for Democratic Participation: Deliberation, Mobilization, and Contestation Since the Onset of the Covid-19 Pandemic) studies how people have taken part in politics since the pandemic, a period of declining trust in democracy and science and growing social divisions. It examines how citizens interact with political institutions and whether these channels allow real participation in decision-making, using surveys, experiments and fieldwork in eight European countries and Tunisia. Funded by Horizon Europe."
  description_es: "INTERFACED (Interfaces for Democratic Participation: Deliberation, Mobilization, and Contestation Since the Onset of the Covid-19 Pandemic) estudia cómo ha participado la ciudadanía en política desde la pandemia, un periodo de pérdida de confianza en la democracia y la ciencia y de divisiones sociales crecientes. Analiza cómo se relaciona la ciudadanía con las instituciones políticas y si esos cauces permiten una participación real en la toma de decisiones, mediante encuestas, experimentos y trabajo de campo en ocho países europeos y Túnez. Financiado por Horizon Europe."
- id: takepart
  name: TakePart
  title: "Social Learning to Take Part in Social Movements: Understanding the Social Transformation of Civic Participation"
  funder: NextGenerationEU
  years_en: 2023 to 2026
  years_es: 2023 a 2026
  role_en: Work package leader
  role_es: Responsable de paquete de trabajo
  status: past
  url: https://takepart.ro/
  description_en: "TakePart (Social Learning to Take Part in Social Movements: Understanding the Social Transformation of Civic Participation) starts from a paradox: traditional civic engagement is declining, while social movements use social media to drive collective action. The project studies how movements turn online interactions into offline activism across Europe. Led by Dan Mercea and funded by the European Union (NextGenerationEU) and the Romanian Government through Romania's National Recovery and Resilience Plan, 2023 to 2026."
  description_es: "TakePart (Social Learning to Take Part in Social Movements: Understanding the Social Transformation of Civic Participation) parte de una paradoja: el compromiso cívico tradicional disminuye, mientras los movimientos sociales usan las redes sociales para impulsar la acción colectiva. El proyecto estudia cómo los movimientos convierten las interacciones online en activismo presencial en Europa. Dirigido por Dan Mercea y financiado por la European Union (NextGenerationEU) y el Romanian Government a través del National Recovery and Resilience Plan de Rumanía, 2023 a 2026."
