  status: past
- id: prodem
  name: ProDem
  title: "Protest and Democracy: How Movement Parties, Social Movements and Active Citizens are Reshaping Europe"
  funder: Volkswagen Foundation
  status: past
  description_en: "ProDem (Protest and Democracy: How Movement Parties, Social Movements and Active Citizens are Reshaping Europe), funded by the Volkswagen Foundation. Its outputs include the edited book <em>Protest and Democracy</em> (Routledge, 2025) and a six-country survey of 10,347 people (2022)."
  description_es: "ProDem (Protest and Democracy: How Movement Parties, Social Movements and Active Citizens are Reshaping Europe), financiado por la Volkswagen Foundation. Entre sus resultados están el libro colectivo <em>Protest and Democracy</em> (Routledge, 2025) y una encuesta en seis países a 10.347 personas (2022)."
