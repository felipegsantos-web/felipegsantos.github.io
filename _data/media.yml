- id: 2022-the-conversation
  outlet: The Conversation
  date: '2022-04-05'
  role: oped
  headline: 'Hungary: election triumph for Viktor Orbán is a warning to progressive parties seeking a marriage of convenience with the far right'
  language: en
  with:
  - Dan Mercea
  summary_en: Argues, with ProDem survey data, that the six-party coalition against Orbán lost many of its parties' earlier voters and that including the far-right Jobbik weakened its message. Concludes that progressive parties should look for partners whose voters share their values.
  summary_es: Sostiene, con datos de encuesta del proyecto ProDem, que la coalición de seis partidos contra Orbán perdió a muchos de los votantes que antes tenían sus partidos y que incluir a Jobbik, de ultraderecha, debilitó su mensaje. Concluye que los partidos progresistas deben buscar socios cuyos votantes compartan sus valores.
  url: https://theconversation.com/hungary-election-triumph-for-viktor-orban-is-a-warning-to-progressive-parties-seeking-a-marriage-of-convenience-with-the-far-right-180196
- id: 2021-chatham-house
  outlet: Chatham House (Undercurrents)
  date: '2021-10-08'
  role: guest
  headline: 'Undercurrents: Europe''s far-right educational institutions'
  language: en
  summary_en: Discusses research published in International Affairs on two far-right institutions of higher education, Hungary's National University of Public Service and the ISSEP in France and Spain, and how they seek to transform the international order rather than reject it.
  summary_es: Analiza, a partir de un artículo publicado en International Affairs, dos instituciones de educación superior vinculadas a la ultraderecha, la Universidad Nacional de la Función Pública de Hungría y el ISSEP en Francia y España, y cómo aspiran a transformar el orden internacional en lugar de rechazarlo.
  url: https://www.chathamhouse.org/2021/10/undercurrents-europes-far-right-educational-institutions
- id: 2020-the-guardian
  outlet: The Guardian
  date: '2020-04-20'
  role: oped
  headline: The global pandemic has spawned new forms of activism – and they’re flourishing
  language: en
  with:
  - Erica Chenoweth
  - Austin Choi-Fitzpatrick
  - Jeremy Pressman
  - Jay Ulfelder
  summary_en: Documents nearly 100 methods of nonviolent action (physical, online and hybrid) that people took up in the first weeks of the pandemic. Argues that the crisis is producing new tactics rather than making social movements obsolete.
  summary_es: Documenta casi un centenar de métodos de acción no violenta (presenciales, online e híbridos) adoptados en las primeras semanas de la pandemia. Sostiene que la crisis está generando nuevas tácticas en lugar de dejar obsoletos a los movimientos sociales.
  url: https://www.theguardian.com/commentisfree/2020/apr/20/the-global-pandemic-has-spawned-new-forms-of-activism-and-theyre-flourishing
- id: 2020-agenda-publica
  outlet: Agenda Pública
  date: '2020-06-15'
  role: oped
  headline: ¿Volveremos a las calles? Disposición a protestar durante la pandemia
  language: es
  with:
  - Olga Onuch
  summary_en: Uses surveys in Argentina and Ukraine to show that many people remained willing to protest during the pandemic, and not only among the young. Warns that governments should not assume the health crisis gives them a free hand, and that civil rights must remain a priority.
  summary_es: Con encuestas en Argentina y Ucrania, muestra que muchas personas seguían dispuestas a protestar durante la pandemia, y no solo entre los jóvenes. Advierte de que los gobiernos no deben dar por hecho que la crisis sanitaria les da carta blanca y de que los derechos civiles deben seguir siendo una prioridad.
  url: https://agendapublica.es/noticia/16967/volveremos-calles-disposicion-protestar-durante-pandemia
