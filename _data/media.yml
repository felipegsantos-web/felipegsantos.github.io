# Media coverage, newest first (the order shown on the site). Templates build everything from these fields.
# `id`: unique slug. `outlet`, `date` (YYYY-MM-DD, or YYYY-MM when the day is not known), `role` (quoted | guest | oped; labels in i18n.yml).
# `headline`: exactly as published, in the language of the piece (`language`: es | en); never translated.
# `summary_en` / `summary_es`: one or two sentences on the piece and Felipe's part in it, verb first, no subject; every entry has both and the page shows the one in its own language. No dashes (scripts/check_media.py).
# `with`: op-eds only (`role: oped`); co-authors, used as authors in the JSON-LD and not shown on the page.
# `url`: link to the piece.
- id: 2026-el-pais-2
  outlet: El País
  date: '2026-10-25'
  role: quoted
  headline: El 29-N desata la “hiperactividad” en el avispero de grupos en torno al PP y Vox
  language: es
  summary_en: Explains the surge of activity among groups around the PP and Vox by a highly polarized campaign and the prospect of a right-wing government, in which they could seek influence and posts. Recalls that similar groups in Hungary and the United States presented themselves as a democratizing force against corrupt elites and then failed to react to abuses by their own side.
  summary_es: Explica la hiperactividad de los grupos en torno al PP y Vox por una campaña muy polarizada y por la perspectiva de un gobierno de derechas, en el que podrían buscar influencia y cargos. Recuerda que en Hungría y Estados Unidos grupos similares se presentaron como una fuerza democratizadora frente a élites corruptas y después no reaccionaron ante los abusos de los suyos.
  url: https://elpais.com/espana/elecciones-generales/2026-10-25/el-29-n-desata-la-hiperactividad-en-el-avispero-de-grupos-en-torno-al-pp-y-vox.html
