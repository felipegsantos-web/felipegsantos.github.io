- id: 2025-eldiario-es
  outlet: elDiario.es
  date: '2025-04-04'
  role: quoted
  headline: El país toma el pulso a la crisis de la vivienda con manifestaciones en 40 ciudades
  language: es
  summary_en: Reads the turnout as a sign of the tenant unions' capacity to mobilize and of an escalating conflict over housing. Argues that the housing movement has long been an early warning of major crises, as V de Vivienda was before the bubble burst and the PAH after it, and that institutions should listen to it.
  summary_es: Interpreta la participación como una muestra de la capacidad de movilización de los sindicatos de inquilinos y de una escalada del conflicto por la vivienda. Sostiene que el movimiento por la vivienda ha sido siempre una alarma ante grandes crisis, como V de Vivienda antes del estallido de la burbuja y la PAH después, y que las instituciones deberían escucharlo.
  url: https://www.eldiario.es/economia/pais-toma-pulso-crisis-vivienda-manifestaciones-40-ciudades_1_12192609.html
