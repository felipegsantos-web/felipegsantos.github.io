name: Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7
        with:
          # _plugins/last_modified.rb reads dates from the git history for <lastmod> in sitemap.xml
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/a11y/package-lock.json

      - name: Install Python dependencies
        run: pip install beautifulsoup4 pyyaml pypdf pikepdf

      - name: Build
        run: |
          set -o pipefail
          bundle exec jekyll build --trace 2>&1 | tee build.log
          if grep -iE "warning|error|deprecat" build.log; then
            echo "::error::The build printed warnings or errors"
            exit 1
          fi

      - name: Internal links and images (html-proofer)
        run: bundle exec htmlproofer ./_site --disable-external

      - name: Language pairs and hreflang
        run: python3 scripts/check_hreflang.py _site

      - name: JSON-LD against _data
        run: python3 scripts/check_jsonld.py _site

      - name: PDF titles, authors and subjects against _data
        run: python3 scripts/pdf_metadata.py --check

      - name: Old PDF paths redirect to files that exist
        run: python3 scripts/check_pdf_redirects.py _site

      - name: Theme answer texts
        run: python3 scripts/check_theme_answers.py

      - name: Contrast of every text and background pair
        run: python3 scripts/check_contrast.py

      - name: Accessibility (axe, WCAG 2.2 AA, both themes, both widths)
        working-directory: scripts/a11y
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node axe.mjs ../../_site

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
