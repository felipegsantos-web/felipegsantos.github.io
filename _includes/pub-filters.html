{%- include vars.html -%}
<div class="filter-bar" role="group" aria-label="{{ I.filter_pubs_label[L] }}">
        <button class="filter-btn active" data-filter="all" aria-pressed="true">{{ I.filter_all[L] }}</button>
        <button class="filter-btn" data-filter="book" aria-pressed="false">{{ I.filter_books[L] }}</button>
        <button class="filter-btn" data-filter="article" aria-pressed="false">{{ I.filter_articles[L] }}</button>
        <button class="filter-btn" data-filter="chapter" aria-pressed="false">{{ I.filter_chapters[L] }}</button>
      </div>
<p class="sr-only" id="pub-count" role="status" aria-live="polite" data-one="{{ I.publication_count.one[L] }}" data-other="{{ I.publication_count.other[L] }}"></p>
