{%- include vars.html -%}
<div class="filter-bar" role="group" aria-label="{{ I.filter_pubs_label[L] }}">
        <button class="filter-btn active" data-filter="all">{{ I.filter_all[L] }}</button>
        <button class="filter-btn" data-filter="book">{{ I.filter_books[L] }}</button>
        <button class="filter-btn" data-filter="article">{{ I.filter_articles[L] }}</button>
        <button class="filter-btn" data-filter="chapter">{{ I.filter_chapters[L] }}</button>
      </div>
