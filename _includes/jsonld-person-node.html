{%- comment -%}
  The Person (@id https://www.felipegsantos.com/#person) as a JSON object, without the surrounding <script>. Everything comes from profile.yml, cv.yml and the language (`lang`, default: the page's).
  Every page defines it exactly once: inside the ProfilePage (homepages and CV pages, see jsonld-person.html) or as a block of its own (jsonld.html). Other blocks refer to it by @id.
{%- endcomment -%}
{%- include vars.html -%}
{%- assign PL = include.lang | default: page.lang -%}
{%- assign k_position = "position_" | append: PL -%}
{%- assign k_desc = "description_" | append: PL -%}
{%- assign post = profile.posts | where: "status", "current" | first -%}
{%- assign edu = site.data.cv | where: "id", "education" | first -%}
{%- assign phd = edu.entries | first -%}
{%- assign k_phd_role = "role_" | append: PL -%}
{%- assign phd_org = phd.org_en | split: ", " | first -%}
{%- assign phd_name = phd[k_phd_role] | split: "," | first -%}
{%- assign phd_year = phd.to | slice: 0, 4 -%}
{%- assign sameas = profile.profiles | where_exp: "p", "p.id != 'email'" -%}
{"@type": "Person", "@id": {{ site.url | append: "/#person" | jsonify }}, "name": {{ profile.name | jsonify }}, "alternateName": {{ profile.name_variants | jsonify }}, "url": {{ site.url | append: "/" | append: PL | append: "/" | jsonify }}, "image": {{ site.url | append: profile.image | jsonify }}, "description": {{ profile[k_desc] | jsonify }}, "jobTitle": {{ profile[k_position] | jsonify }}, "worksFor": {"@type": "CollegeOrUniversity", "name": {{ post.institution | jsonify }}, "url": {{ post.institution_url | jsonify }}, "department": {"@type": "Organization", "name": {{ post.department_en | jsonify }}}}, "alumniOf": {"@type": "CollegeOrUniversity", "name": {{ phd_org | jsonify }}}, "hasCredential": {"@type": "EducationalOccupationalCredential", "credentialCategory": "degree", "name": {{ phd_name | jsonify }}, "recognizedBy": {"@type": "CollegeOrUniversity", "name": {{ phd_org | jsonify }}}, "validFrom": {{ phd_year | jsonify }}}, "email": {{ profile.email | jsonify }}, "identifier": {"@type": "PropertyValue", "propertyID": "ORCID", "value": {{ profile.orcid | jsonify }}, "url": "https://orcid.org/{{ profile.orcid }}"}, "sameAs": [{% for p in sameas %}{{ p.url | jsonify }}, {% endfor %}{% for p in profile.other_profiles %}{{ p.url | jsonify }}{% unless forloop.last %}, {% endunless %}{% endfor %}], "knowsAbout": {{ profile.knows_about | jsonify }}}
