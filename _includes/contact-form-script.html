{%- include vars.html -%}
<script>
(function(){
  var form = document.getElementById('contact-form');
  if(!form) return;
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var btn = form.querySelector('.form-submit');
    var ok  = form.querySelector('.form-feedback--success');
    var err = form.querySelector('.form-feedback--error');
    btn.disabled = true;
    btn.textContent = btn.dataset.sending;
    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      body: new FormData(form)
    }).then(function(r){ return r.json(); }).then(function(d){
      if(d.success){
        ok.hidden = false;
        err.hidden = true;
        form.reset();
      } else {
        err.hidden = false;
        ok.hidden = true;
      }
    }).catch(function(){
      err.hidden = false;
      ok.hidden = true;
    }).finally(function(){
      btn.disabled = false;
      btn.textContent = btn.dataset.sending === btn.textContent ? '{{ I.contact_send[L] }}' : btn.textContent;
      btn.textContent = '{{ I.contact_send[L] }}';
    });
  });
})();
</script>
