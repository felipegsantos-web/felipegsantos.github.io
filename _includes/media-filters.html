{%- include vars.html -%}
<div class="filter-bar mt-sp6" role="group" aria-label="{{ I.filter_media_label[L] }}">
      <button class="filter-btn active" data-media-filter="all" aria-pressed="true">{{ I.media_filter_all[L] }}</button>
      {%- for r in I.media_role %}
      <button class="filter-btn" data-media-filter="{{ r[0] }}" aria-pressed="false">{{ r[1].filter[L] }}</button>
      {%- endfor %}
    </div>
