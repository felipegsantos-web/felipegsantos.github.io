{%- include vars.html -%}
<div class="filter-bar mt-sp6" role="group" aria-label="{{ I.filter_media_label[L] }}">
      <button class="filter-btn active" data-media-filter="all">{{ I.filter_all[L] }}</button>
      {%- for f in I.media_format %}
      <button class="filter-btn" data-media-filter="{{ f[0] }}">{{ f[1][L] }}</button>
      {%- endfor %}
    </div>
